{% extends "auth_base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <div class="auth-title">Create your account</div>
  <div class="auth-sub">Track expenses, investments and SIP goals in one place.</div>

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" value="{{ username or '' }}"
             minlength="3" maxlength="30" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ email or '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" minlength="6" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm password</label>
      <input type="password" name="confirm" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-accent w-100">Register</button>
  </form>

  <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
